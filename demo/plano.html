<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fim de semana em Porto Claro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="demo.css">
</head>
<body>
<div class="wrap">
  <main class="plan">
    <div class="map">
      <svg viewBox="0 0 640 460" role="img" aria-label="">
        <rect width="640" height="460" fill="#f2efe6"/>
        <!-- sea and beach -->
        <path d="M470 0 C440 90 500 160 460 250 C430 320 470 400 450 460 L640 460 L640 0 z" fill="#a9d3f0"/>
        <path d="M470 0 C440 90 500 160 460 250 C430 320 470 400 450 460 L430 460 C452 400 410 320 440 250 C480 160 420 90 452 0 z" fill="#f1e2bf"/>
        <!-- river -->
        <path d="M0 300 C90 280 150 320 230 300 C310 280 380 300 446 270" fill="none" stroke="#a9d3f0" stroke-width="16" stroke-linecap="round"/>
        <!-- park -->
        <rect x="70" y="70" width="130" height="100" rx="18" fill="#bfdcb5"/>
        <g fill="#8fc79a"><circle cx="105" cy="105" r="14"/><circle cx="140" cy="128" r="16"/><circle cx="172" cy="100" r="12"/><circle cx="160" cy="150" r="10"/></g>
        <!-- streets -->
        <g stroke="#ffffff" stroke-width="12" stroke-linecap="round" fill="none">
          <path d="M20 220 H430"/><path d="M20 380 H440"/><path d="M240 20 V440"/><path d="M360 20 V440"/><path d="M40 40 L420 120"/>
          <path d="M240 220 L120 440"/>
        </g>
        <g stroke="#e3ddcf" stroke-width="2" fill="none"><path d="M20 220 H430"/><path d="M240 20 V440"/></g>
        <!-- bridge -->
        <rect x="228" y="286" width="24" height="30" rx="3" fill="#d9d2c1"/>
        <!-- blocks -->
        <g fill="#e5dfd1">
          <rect x="262" y="40" width="80" height="60" rx="8"/><rect x="262" y="140" width="80" height="62" rx="8"/>
          <rect x="70" y="236" width="140" height="40" rx="8"/><rect x="262" y="236" width="80" height="40" rx="8"/>
          <rect x="262" y="326" width="80" height="38" rx="8"/><rect x="40" y="396" width="60" height="40" rx="8"/>
        </g>
        <!-- pins -->
        <g font-size="15" font-weight="700" text-anchor="middle" fill="#ffffff">
          <circle cx="302" cy="170" r="16" fill="#3b6fd8"/><text x="302" y="175">1</text>
          <circle cx="140" cy="256" r="16" fill="#e8894a"/><text x="140" y="261">2</text>
          <circle cx="135" cy="120" r="16" fill="#6b4fa0"/><text x="135" y="125">3</text>
          <circle cx="470" cy="330" r="16" fill="#2f9e6e"/><text x="470" y="335">4</text>
        </g>
        <g font-size="14" font-weight="600" fill="#1f2430">
          <text x="324" y="196" data-t="m1">Hotel</text>
          <text x="162" y="250" data-t="m2">Mercado</text>
          <text x="157" y="114" data-t="m3">Museu</text>
          <text x="492" y="335" data-t="m4">Praia</text>
          <text x="60" y="326" font-weight="500" fill="#5b88b3" font-style="italic" data-t="river">Rio Claro</text>
        </g>
        <!-- compass -->
        <g transform="translate(590 46)"><circle r="20" fill="#ffffff" opacity=".9"/><path d="M0 -14 L6 4 L0 0 L-6 4 z" fill="#1f2430"/><text y="16" font-size="10" text-anchor="middle" fill="#1f2430">N</text></g>
      </svg>
    </div>
    <div class="days">
      <h1 data-t="h1">Fim de semana em Porto Claro</h1>
      <p class="sub" data-t="sub">Roteiro a pé, sem pressa.</p>
      <div class="day">
        <h2 data-t="sat">Sábado</h2>
        <div class="stop"><span class="pin" style="background:#3b6fd8">1</span><time>09:00</time><span data-t="t1">Café no hotel</span></div>
        <div class="stop"><span class="pin" style="background:#e8894a">2</span><time>10:30</time><span data-t="t2">Mercado da ponte</span></div>
        <div class="stop"><span class="pin" style="background:#6b4fa0">3</span><time>14:00</time><span data-t="t3">Museu do parque</span></div>
        <div class="stop"><span class="pin" style="background:#2f9e6e">4</span><time>17:30</time><span data-t="t4">Pôr do sol na praia</span></div>
      </div>
      <div class="day">
        <h2 data-t="sun">Domingo</h2>
        <div class="blank"></div><div class="blank"></div><div class="blank"></div>
      </div>
    </div>
  </main>
</div>
<script>
window.T = {
  en: { title: 'A weekend in Porto Claro', h1: 'A weekend in Porto Claro', sub: 'A walking plan, no rush.', sat: 'Saturday', sun: 'Sunday',
    m1: 'Hotel', m2: 'Market', m3: 'Museum', m4: 'Beach', river: 'Clear River',
    t1: 'Breakfast at the hotel', t2: 'Bridge market', t3: 'Park museum', t4: 'Sunset at the beach' },
  es: { title: 'Fin de semana en Porto Claro', h1: 'Fin de semana en Porto Claro', sub: 'Ruta a pie, sin prisa.', sat: 'Sábado', sun: 'Domingo',
    m1: 'Hotel', m2: 'Mercado', m3: 'Museo', m4: 'Playa', river: 'Río Claro',
    t1: 'Desayuno en el hotel', t2: 'Mercado del puente', t3: 'Museo del parque', t4: 'Atardecer en la playa' }
};
</script>
<script src="demo.js"></script>
</body>
</html>
